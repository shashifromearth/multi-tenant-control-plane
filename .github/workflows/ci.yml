name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Lint, type-check, security scan and full test suite (in Docker)
        run: make check
      - name: Tear down
        if: always()
        run: make clean
